<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Protegida de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/usuarios-admin.js"></script>
    <script src="js/seguridad-ui.js"></script>
    <script>
        // Defensa adicional contra clickjacking
        if (window.top !== window.self) {
            window.top.location = window.self.location;
        }
        // Revisión inmediata de acceso por URL (Admin o Empleado)
        const sesionStaff = verificarAccesoPagina(["Admin", "Empleado"]);
    </script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Gestión</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link" href="catalogo.html">Catálogo</a>
                <a class="nav-link active" href="clientes.html">Clientes</a>
                <a class="nav-link" id="navLinkEmpleados" href="empleados.html">Empleados y Roles</a>
                <button type="button" id="btnCerrarSesion" class="btn btn-sm btn-outline-light ms-lg-3">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 mb-0">Consulta y Baja de Clientes</h1>
            <span class="badge bg-secondary">Acceso: Admin / Empleado</span>
        </div>

        <div id="mensajeClientes" class="alert d-none" role="alert"></div>

        <!-- Buscador cuidadoso: nunca hace SELECT * de todos los clientes -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white fw-semibold">
                Buscar cliente específico
            </div>
            <div class="card-body">
                <form id="formBuscarCliente" autocomplete="off">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-9">
                            <label for="criterioCliente" class="form-label">ID de cliente, empresa o nombre de contacto (mínimo 2 caracteres)</label>
                            <input type="text" id="criterioCliente" class="form-control" minlength="2" maxlength="40" placeholder="Ej. ALFKI o Alfreds" required>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100">Buscar cliente</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de resultados con datos enmascarados -->
        <div class="card shadow-sm">
            <div class="card-header bg-white fw-semibold">
                Resultados de búsqueda (datos personales protegidos)
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Empresa</th>
                            <th>Contacto</th>
                            <th>Ciudad</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaClientesBody">
                        <tr>
                            <td colspan="7" class="text-center text-muted">Realiza una búsqueda puntual para visualizar clientes activos.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        if (sesionStaff) {
            document.addEventListener("DOMContentLoaded", () => {
                // Ocultar enlace de Empleados si quien entró es Empleado y no Admin
                if (sesionStaff.rol !== "Admin") {
                    const linkEmp = document.getElementById("navLinkEmpleados");
                    if (linkEmp) linkEmp.classList.add("d-none");
                }

                document.getElementById("formBuscarCliente")
                    .addEventListener("submit", (e) => buscarClientes(e, sesionStaff.token));

                document.getElementById("btnCerrarSesion")
                    .addEventListener("click", () => {
                        localStorage.removeItem("token");
                        window.location.replace("index.html");
                    });
            });
        }
    </script>
</body>
</html>
