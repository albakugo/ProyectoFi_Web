<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis Pedidos</title>
    <script src="js/auth-guard.js" data-roles="Cliente"></script>
    <script>
        if (window.top !== window.self) {
            window.top.location = window.self.location;
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">
    <div id="navbarPrincipal"></div>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Mis Pedidos</h1>
            <a href="catalogo.html" class="btn btn-outline-primary">Ir al catálogo / carrito</a>
        </div>

        <div id="mensaje" class="alert d-none" role="alert"></div>

        <div class="card shadow-sm">
            <div class="card-header bg-white fw-semibold">
                Historial de compras realizadas
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Orden #</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Detalle de productos</th>
                            <th class="text-end">Total</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPedidos">
                        <tr>
                            <td colspan="5" class="text-center text-muted">Cargando historial de pedidos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/seguridad-ui.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        const API_MIS_PEDIDOS = 'https://localhost:7214/api/Orders/mis-pedidos';

        function mostrarMensaje(texto, tipo) {
            const caja = document.getElementById('mensaje');
            caja.textContent = texto;
            caja.className = 'alert alert-' + tipo;
            caja.classList.remove('d-none');
        }

        async function cargarMisPedidos() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.replace('login.html');
                return;
            }

            try {
                const resp = await fetch(API_MIS_PEDIDOS, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (resp.status === 401) {
                    window.AuthGuard.cerrarSesion();
                    return;
                }

                const pedidos = await resp.json();
                if (!resp.ok) {
                    mostrarMensaje(pedidos.mensaje || 'No se pudieron cargar tus pedidos.', 'danger');
                    return;
                }

                const tbody = document.getElementById('tablaPedidos');
                tbody.replaceChildren();

                if (pedidos.length === 0) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.colSpan = 5;
                    td.className = 'text-center text-muted py-4';
                    td.textContent = 'Aún no tienes compras confirmadas.';
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                    return;
                }

                pedidos.forEach(p => {
                    const tr = document.createElement('tr');

                    const tdId = document.createElement('td');
                    tdId.className = 'fw-bold';
                    tdId.textContent = '#' + p.orderId;

                    const tdFecha = document.createElement('td');
                    tdFecha.textContent = p.orderDate
                        ? new Date(p.orderDate).toLocaleString('es-MX')
                        : 'Sin fecha';

                    const tdEstado = document.createElement('td');
                    const badge = document.createElement('span');
                    badge.className = 'badge bg-success';
                    badge.textContent = p.estado || 'Confirmado';
                    tdEstado.appendChild(badge);

                    const tdDetalle = document.createElement('td');
                    const resumen = (p.productos || [])
                        .map(item => `${item.nombre} (x${item.quantity})`)
                        .join(', ');
                    tdDetalle.textContent = resumen || 'Sin detalle';

                    const tdTotal = document.createElement('td');
                    tdTotal.className = 'text-end fw-bold text-success';
                    tdTotal.textContent = '$' + Number(p.total || 0).toFixed(2);

                    tr.append(tdId, tdFecha, tdEstado, tdDetalle, tdTotal);
                    tbody.appendChild(tr);
                });
            } catch {
                mostrarMensaje('Error de conexión con el servidor al consultar tus pedidos.', 'danger');
            }
        }

        cargarMisPedidos();
    </script>
</body>

</html>
