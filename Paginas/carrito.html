<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">
    <div class="container py-4">
        <h1 class="mb-3">Mi Carrito</h1>

        <div id="mensaje" class="alert d-none" role="alert"></div>

        <div class="row g-4">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Agregar producto</h5>

                        <label for="selectProducto" class="form-label">Producto</label>
                        <select id="selectProducto" class="form-select">
                            <option value="">Cargando...</option>
                        </select>
                        <div id="infoProducto" class="form-text mb-3"></div>

                        <label for="cantidad" class="form-label">Cantidad</label>
                        <input type="number" id="cantidad" class="form-control mb-3" min="1" value="1">

                        <button id="btnAgregar" type="button" class="btn btn-primary w-100">Agregar al carrito</button>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Productos en tu carrito</h5>

                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Cant.</th>
                                    <th>Precio</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody id="tablaCarrito"></tbody>
                        </table>

                        <p id="carritoVacio" class="text-muted">Tu carrito está vacío.</p>

                        <h4 class="text-end">Total: <span id="total">$0.00</span></h4>

                        <button id="btnComprar" type="button" class="btn btn-success w-100 mt-2" disabled>
                            Confirmar compra
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Dirección de la API
        const API = 'https://localhost:7214/api';
        

        let token = null;
        let productos = [];

        const selectProducto = document.getElementById('selectProducto');
        const infoProducto = document.getElementById('infoProducto');
        const inputCantidad = document.getElementById('cantidad');
        const btnAgregar = document.getElementById('btnAgregar');
        const btnComprar = document.getElementById('btnComprar');

        function mostrarMensaje(texto, tipo) {
            const caja = document.getElementById('mensaje');
            caja.textContent = texto;
            caja.className = 'alert alert-' + tipo;
        }

        // Busca el token del login
        async function obtenerToken() {
            const guardado = localStorage.getItem('token') || sessionStorage.getItem('token');
            
            if (guardado) return guardado;

            const r = await fetch(API + '/TokenPrueba?customerId=ALFKI');
            if (!r.ok) throw new Error('No se pudo obtener el token de prueba. ¿La API está en modo Development?');
            const datos = await r.json();
            return datos.token;
        }

        async function llamarApi(ruta, opciones = {}) {
            const respuesta = await fetch(API + ruta, {
                ...opciones,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                }
            });

            if (respuesta.status === 401) {
                localStorage.removeItem('token');
                sessionStorage.removeItem('token');
                throw new Error('Tu sesión expiró. Recarga la página.');
            }
            if (respuesta.status === 403) {
                throw new Error('No tienes permiso para hacer esto.');
            }

            const datos = await respuesta.json().catch(() => ({}));
            if (!respuesta.ok) {
                throw new Error(datos.mensaje || 'Ocurrió un error. Intenta de nuevo.');
            }
            return datos;
        }
//productos no descontinuados
        async function cargarProductos() {
            const todos = await llamarApi('/Products');
            productos = todos.filter(p => p.discontinued === false);

            selectProducto.replaceChildren(new Option('Elige un producto...', ''));
            productos.forEach(p => {
                selectProducto.add(new Option(p.productName, p.productId));
            });
        }

        selectProducto.addEventListener('change', () => {
            const p = productos.find(x => x.productId == selectProducto.value);
            if (p) {
                const precio = Number(p.unitPrice || 0).toFixed(2);
                infoProducto.textContent = 'Stock: ' + (p.unitsInStock || 0) + '  |  Precio: $' + precio;
            } else {
                infoProducto.textContent = '';
            }
        });

        async function cargarCarrito() {
            const datos = await llamarApi('/Orders/carrito');
            const tbody = document.getElementById('tablaCarrito');
            tbody.replaceChildren();

            datos.items.forEach(item => {
                const fila = document.createElement('tr');
                const valores = [
                    item.productName,
                    item.quantity,
                    '$' + Number(item.unitPrice).toFixed(2),
                    '$' + Number(item.subtotal).toFixed(2)
                ];
                valores.forEach(valor => {
                    const celda = document.createElement('td');
                    celda.textContent = valor;
                    fila.appendChild(celda);
                });
                tbody.appendChild(fila);
            });

            const hayProductos = datos.items.length > 0;
            document.getElementById('carritoVacio').classList.toggle('d-none', hayProductos);
            document.getElementById('total').textContent = '$' + Number(datos.total).toFixed(2);
            btnComprar.disabled = !hayProductos;
        }

        btnAgregar.addEventListener('click', async () => {
            const productId = Number(selectProducto.value);
            const quantity = Number(inputCantidad.value);

            if (!productId) {
                mostrarMensaje('Elige un producto.', 'warning');
                return;
            }
            if (!Number.isInteger(quantity) || quantity < 1) {
                mostrarMensaje('La cantidad debe ser un número entero mayor a 0.', 'warning');
                return;
            }

            try {
                const r = await llamarApi('/Orders/carrito/agregar', {
                    method: 'POST',
                    body: JSON.stringify({ productId, quantity })
                });
                mostrarMensaje(r.mensaje, 'success');
                await cargarCarrito();
            } catch (error) {
                mostrarMensaje(error.message, 'danger');
            }
        });

        btnComprar.addEventListener('click', async () => {
            try {
                const r = await llamarApi('/Orders/comprar', { method: 'POST' });
                mostrarMensaje(r.mensaje + ' Total: $' + Number(r.total).toFixed(2), 'success');
                await cargarProductos();
                infoProducto.textContent = '';
                await cargarCarrito();
            } catch (error) {
                mostrarMensaje(error.message, 'danger');
            }
        });

        async function iniciar() {
            try {
                token = await obtenerToken();
                await cargarProductos();
                await cargarCarrito();
            } catch (error) {
                mostrarMensaje(error.message, 'danger');
            }
        }

        iniciar();
    </script>
</body>

</html>
