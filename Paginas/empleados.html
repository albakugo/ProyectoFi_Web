<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empleados y Roles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/usuarios-admin.js"></script>
    <script src="js/seguridad-ui.js"></script>
    <script>
        // Defensa adicional contra clickjacking
        if (window.top !== window.self) {
            window.top.location = window.self.location;
        }
        // Revisión inmediata de acceso por URL (Exclusivo Admin)
        const sesionAdmin = verificarAccesoPagina(["Admin"]);
    </script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Gestión</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link" href="catalogo.html">Catálogo</a>
                <a class="nav-link" href="clientes.html">Clientes</a>
                <a class="nav-link active" href="empleados.html">Empleados y Roles</a>
                <button type="button" id="btnCerrarSesion" class="btn btn-sm btn-outline-light ms-lg-3">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 mb-0">Alta y Gestión de Empleados / Administradores</h1>
            <span class="badge bg-primary">Acceso exclusivo: Admin</span>
        </div>

        <div id="mensajeEmpleados" class="alert d-none" role="alert"></div>

        <!-- Formulario controlado por JS sin action ni method directo a la API -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white fw-semibold">
                Registrar nuevo empleado o administrador
            </div>
            <div class="card-body">
                <form id="formRegistrarEmpleado" autocomplete="off">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="empUsuario" class="form-label">Usuario de acceso *</label>
                            <input type="text" id="empUsuario" class="form-control" minlength="4" maxlength="40" required>
                        </div>
                        <div class="col-md-4">
                            <label for="empEmail" class="form-label">Correo electrónico *</label>
                            <input type="email" id="empEmail" class="form-control" maxlength="100" required>
                        </div>
                        <div class="col-md-4">
                            <label for="empPassword" class="form-label">Contraseña inicial *</label>
                            <input type="password" id="empPassword" class="form-control" minlength="8" maxlength="60" required>
                        </div>

                        <div class="col-md-3">
                            <label for="empRol" class="form-label">Rol en el sistema *</label>
                            <select id="empRol" class="form-select" required>
                                <option value="Empleado" selected>Empleado</option>
                                <option value="Admin">Administrador</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="empNombre" class="form-label">Nombre *</label>
                            <input type="text" id="empNombre" class="form-control" maxlength="10" required>
                        </div>
                        <div class="col-md-3">
                            <label for="empApellido" class="form-label">Apellido *</label>
                            <input type="text" id="empApellido" class="form-control" maxlength="20" required>
                        </div>
                        <div class="col-md-3">
                            <label for="empPuesto" class="form-label">Puesto</label>
                            <input type="text" id="empPuesto" class="form-control" maxlength="30" placeholder="Ej. Ejecutivo de Ventas">
                        </div>

                        <div class="col-md-4">
                            <label for="empCiudad" class="form-label">Ciudad</label>
                            <input type="text" id="empCiudad" class="form-control" maxlength="15">
                        </div>
                        <div class="col-md-4">
                            <label for="empTelefono" class="form-label">Teléfono</label>
                            <input type="text" id="empTelefono" class="form-control" maxlength="24">
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">Registrar en Sistema y Empleados</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de empleados activos -->
        <div class="card shadow-sm">
            <div class="card-header bg-white fw-semibold">
                Personal activo registrado
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre completo</th>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th>Puesto</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaEmpleadosBody">
                        <tr>
                            <td colspan="8" class="text-center text-muted">Cargando personal...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        if (sesionAdmin) {
            document.addEventListener("DOMContentLoaded", () => {
                cargarEmpleados(sesionAdmin.token);

                document.getElementById("formRegistrarEmpleado")
                    .addEventListener("submit", (e) => registrarEmpleado(e, sesionAdmin.token));

                document.getElementById("btnCerrarSesion")
                    .addEventListener("click", () => {
                        localStorage.removeItem("token");
                        window.location.replace("index.html");
                    });
            });
        }
    </script>
</body>
</html>
