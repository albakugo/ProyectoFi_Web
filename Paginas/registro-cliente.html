<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de Cliente</title>
    <script>
        if (window.top !== window.self) {
            window.top.location = window.self.location;
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="card shadow" style="max-width: 500px; width: 100%;">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">Crear cuenta de Cliente</h4>
            </div>

            <div class="card-body p-4">
                <form id="formRegistroCliente">
                    <div class="mb-3">
                        <label for="empresa" class="form-label fw-semibold">Empresa *</label>
                        <input type="text" class="form-control" id="empresa" maxlength="40" required
                            placeholder="Ej. Distribuidora Norte">
                    </div>

                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-semibold">Nombre de contacto *</label>
                        <input type="text" class="form-control" id="nombre" maxlength="100" required
                            placeholder="Ej. Sofía Hernández">
                    </div>

                    <div class="mb-3">
                        <label for="telefono" class="form-label fw-semibold">Teléfono (opcional)</label>
                        <input type="tel" class="form-control" id="telefono" maxlength="24"
                            placeholder="Ej. 445-123-4567">
                    </div>

                    <div class="mb-3">
                        <label for="nombreUsuario" class="form-label fw-semibold">Nombre de usuario *</label>
                        <input type="text" class="form-control" id="nombreUsuario" maxlength="50" required
                            autocomplete="username" placeholder="Ej. sofia_cliente">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Correo electrónico *</label>
                        <input type="email" class="form-control" id="email" maxlength="100" required
                            autocomplete="email" placeholder="cliente@empresa.com">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Contraseña *</label>
                        <input type="password" class="form-control" id="password" minlength="8" required
                            autocomplete="new-password" placeholder="Mínimo 8 caracteres">
                        <div class="form-text">Mínimo 8 caracteres.</div>
                    </div>

                    <div id="mensajeRegistro" class="alert d-none" role="alert"></div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" id="btnRegistrar" class="btn btn-primary btn-lg">
                            Registrarme
                        </button>
                        <a href="login.html" class="btn btn-outline-secondary">
                            ¿Ya tienes cuenta? Inicia sesión
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_REGISTRO_CLIENTE = "https://localhost:7214/api/Auth/registro-cliente";

        const formRegistro = document.getElementById("formRegistroCliente");
        const mensajeRegistro = document.getElementById("mensajeRegistro");
        const btnRegistrar = document.getElementById("btnRegistrar");

        function mostrarMensaje(texto, tipo) {
            mensajeRegistro.className = `alert alert-${tipo}`;
            mensajeRegistro.textContent = texto;
            mensajeRegistro.classList.remove("d-none");
        }

        formRegistro.addEventListener("submit", async (e) => {
            e.preventDefault();
            mensajeRegistro.classList.add("d-none");

            const payload = {
                nombreUsuario: document.getElementById("nombreUsuario").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value,
                nombre: document.getElementById("nombre").value.trim(),
                empresa: document.getElementById("empresa").value.trim(),
                telefono: document.getElementById("telefono").value.trim() || null
            };

            if (payload.password.length < 8) {
                mostrarMensaje("La contraseña debe tener al menos 8 caracteres.", "warning");
                return;
            }

            btnRegistrar.disabled = true;
            btnRegistrar.textContent = "Registrando...";

            try {
                const respuesta = await fetch(API_REGISTRO_CLIENTE, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const texto = await respuesta.text();
                let datos = {};
                try { datos = texto ? JSON.parse(texto) : {}; } catch { datos = { mensaje: texto }; }

                if (!respuesta.ok) {
                    const detalleValidacion = datos.errors
                        ? Object.values(datos.errors).flat().join(" ")
                        : null;
                    mostrarMensaje(
                        datos.mensaje || detalleValidacion || "No se pudo completar el registro.",
                        "danger"
                    );
                    return;
                }

                mostrarMensaje(
                    `${datos.mensaje || "Cuenta creada correctamente."} Redirigiendo al inicio de sesión...`,
                    "success"
                );
                formRegistro.reset();
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);

            } catch (error) {
                mostrarMensaje("Error al conectarse con el servidor. Intenta nuevamente.", "danger");
            } finally {
                btnRegistrar.disabled = false;
                btnRegistrar.textContent = "Registrarme";
            }
        });
    </script>
</body>

</html>
