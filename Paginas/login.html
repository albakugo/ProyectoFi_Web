<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-5 col-lg-4">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">Iniciar sesión</h4>
                    </div>

                    <div class="card-body p-4">

                        <form id="frmLogin">

                            <div class="mb-3">
                                <label for="usuario" class="form-label">
                                    Usuario o correo electrónico
                                </label>

                                <input type="text" class="form-control"
                                    id="usuario" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Contraseña
                                </label>

                                <input type="password" class="form-control"
                                    id="password" required>
                            </div>

                            <hr>

                            <div class="mb-3 text-center">

                                <label class="form-label fw-bold">
                                    Verificación de seguridad
                                </label>

                                <div class="alert alert-secondary">
                                    <span id="preguntaCaptcha">Cargando CAPTCHA...</span>
                                </div>

                                <input type="text" class="form-control"
                                    id="respuestaCaptcha"
                                    placeholder="Escribe el resultado"
                                    required>

                                <button type="button" class="btn btn-outline-primary btn-sm mt-2"
                                    onclick="generarCaptcha()">
                                    Nuevo CAPTCHA
                                </button>

                            </div>

                            <div id="mensaje" class="alert d-none" role="alert"></div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" id="btnLogin" class="btn btn-primary btn-lg">
                                    Iniciar sesión
                                </button>
                                
                                <a href="registro-cliente.html" class="btn btn-outline-secondary">
                                    ¿No tienes cuenta? Regístrate como cliente
                                </a>
                            </div>
                        </form>

                    </div>

                    <div class="card-footer text-center text-muted">
                        
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const API_BASE = "https://localhost:7214/api/Auth";

        let captchaId = "";

        // Mostrar mensajes
        function mostrarMensaje(texto, tipo) {

            const mensaje = document.getElementById("mensaje");

            mensaje.textContent = texto;
            mensaje.className = "alert alert-" + tipo;
        }

        // Generar CAPTCHA
        async function generarCaptcha() {

            const pregunta = document.getElementById("preguntaCaptcha");

            pregunta.textContent = "Cargando CAPTCHA...";

            try {

                const response = await fetch(`${API_BASE}/captcha`);

                if (!response.ok) {
                    throw new Error("No se pudo generar el CAPTCHA");
                }

                const data = await response.json();

                captchaId = data.captchaId;

                pregunta.textContent = data.pregunta;

                document.getElementById("respuestaCaptcha").value = "";

            } catch (error) {

                pregunta.textContent = "Error al cargar CAPTCHA";

                mostrarMensaje(
                    "Error al conectarse con el servidor. Intenta nuevamente.",
                    "danger"
                );

            }
        }

        // Iniciar sesión
        document.getElementById("frmLogin").addEventListener("submit", async function (event) {

            event.preventDefault();

            const usuario = document.getElementById("usuario").value;
            const password = document.getElementById("password").value;
            const respuestaCaptcha = document.getElementById("respuestaCaptcha").value;

            if (!captchaId) {
                mostrarMensaje("Primero debes generar un CAPTCHA.", "warning");
                return;
            }

            const btnLogin = document.getElementById("btnLogin");

            btnLogin.disabled = true;
            btnLogin.textContent = "Verificando...";

            try {

                const response = await fetch(`${API_BASE}/login`, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        usuario: usuario,
                        password: password,
                        captchaId: captchaId,
                        respuestaCaptcha: respuestaCaptcha
                    })

                });

                const data = await response.json();

                if (!response.ok) {
                    mostrarMensaje(
                        data.mensaje || "No se pudo iniciar sesión.",
                        "danger"
                    );

                    // Si la cuenta está bloqueada, no genera otro CAPTCHA
                    if (data.mensaje && data.mensaje.includes("bloqueada")) {
                        return;
                    }

                    await generarCaptcha();

                    return;
                }

                localStorage.setItem("token", data.token);
                localStorage.setItem("rol", data.rol);
                localStorage.setItem("usuario", data.usuario);
                sessionStorage.clear();

                if (data.rol === "Admin" || data.rol === "Empleado") {
                    //redirige al CRUD de productos
                    window.location.href = "index.html";
                } else {
                    window.location.href = "catalogo.html";
                }

            } catch (error) {

                mostrarMensaje(
                    "Error de conexión con la API.",
                    "danger"
                );

                await generarCaptcha();

            } finally {

                btnLogin.disabled = false;
                btnLogin.textContent = "Iniciar sesión";

            }

        });

        // Generar CAPTCHA al abrir la página
        generarCaptcha();

    </script>

</body>
</html>
