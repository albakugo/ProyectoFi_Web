<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de Productos</title>

    <script src="js/auth-guard.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .product-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.12) !important;
        }
    </style>
</head>

<body class="bg-light">
    <div id="navbarPrincipal"></div>

    <div class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <div>
                <h1 class="mb-0">Catálogo de Productos</h1>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="formBusqueda" class="row g-2 align-items-center">
                    <div class="col-md-8">
                        <label for="txtBusqueda" class="visually-hidden">Buscar producto</label>
                        <input type="text" id="txtBusqueda" class="form-control form-control-lg"
                            placeholder="Buscar por nombre de producto, categoría o proveedor...">
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="submit" id="btnBuscar" class="btn btn-primary btn-lg">
                            <span id="spinnerBtnBuscar" class="spinner-border spinner-border-sm d-none me-1" role="status"></span>
                            <span id="textoBtnBuscar">Buscar</span>
                        </button>
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="button" id="btnLimpiarBusqueda" class="btn btn-outline-secondary btn-lg">
                            Limpiar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div id="estadoProceso" class="alert alert-info d-flex align-items-center justify-content-between py-2" role="alert">
            <span id="mensajeEstado">Iniciando catálogo...</span>
            <span id="contadorResultados" class="badge bg-dark">0 de 0 mostrados</span>
        </div>

        <div id="panelCarrito" class="card shadow-sm mb-4 d-none">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">Carrito de Compras</h5>
                <button type="button" id="btnRefrescarCarrito" class="btn btn-sm btn-outline-primary">
                    Actualizar carrito
                </button>
            </div>
            <div class="card-body">
                <div id="mensajeCarrito" class="alert d-none py-2 mb-3" role="alert"></div>

                <div id="detalleCarrito">
                    <p class="text-muted mb-0">Aún no has cargado el carrito o está vacío.</p>
                </div>

                <div class="d-flex justify-content-between align-items-center border-top pt-3 mt-3">
                    <h5 class="mb-0">Total: <span id="totalCarritoTexto" class="text-success fw-bold">$0.00</span></h5>
                    <button type="button" id="btnConfirmarCompra" class="btn btn-primary fw-semibold">
                        Confirmar compra
                    </button>
                </div>
            </div>
        </div>

        <div id="contenedorCards" class="row row-cols-1 row-cols-md-3 g-4"></div>

        <div id="indicadorScroll" class="text-center my-5 py-3">
            <div id="spinnerScroll" class="d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 fw-semibold text-primary">Cargando siguiente página de productos...</p>
            </div>
            <p id="mensajeFinCatalogo" class="text-muted fw-semibold d-none">
                Has llegado al final de los productos disponibles.
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/seguridad-ui.js"></script>
    <script src="js/navbar.js"></script>

    <script>
        const API_BASE_URL = 'https://localhost:7214';
        const API_URL_PAGINADO = `${API_BASE_URL}/api/Products/paginado`;
        const API_ORDERS_BASE = `${API_BASE_URL}/api/Orders`;
        const TAMANIO_PAGINA = 12;

        let paginaActual = 1;
        let filtroActual = '';
        let cargando = false;
        let hayMasPaginas = true;
        let totalMostrados = 0;

        const formBusqueda = document.getElementById('formBusqueda');
        const txtBusqueda = document.getElementById('txtBusqueda');
        const btnBuscar = document.getElementById('btnBuscar');
        const btnLimpiarBusqueda = document.getElementById('btnLimpiarBusqueda');
        const spinnerBtnBuscar = document.getElementById('spinnerBtnBuscar');
        const textoBtnBuscar = document.getElementById('textoBtnBuscar');
        const contenedorCards = document.getElementById('contenedorCards');
        const estadoProceso = document.getElementById('estadoProceso');
        const mensajeEstado = document.getElementById('mensajeEstado');
        const contadorResultados = document.getElementById('contadorResultados');
        const spinnerScroll = document.getElementById('spinnerScroll');
        const mensajeFinCatalogo = document.getElementById('mensajeFinCatalogo');
        const btnRefrescarCarrito = document.getElementById('btnRefrescarCarrito');
        const btnConfirmarCompra = document.getElementById('btnConfirmarCompra');

        function obtenerTokenJwt() {
            return localStorage.getItem('token') || '';
        }

        function esUsuarioCliente() {
            const sesion = window.AuthGuard?.obtenerSesionActual();
            return (sesion?.rol || localStorage.getItem('rol')) === 'Cliente';
        }

        async function leerRespuestaSegura(resp) {
            const texto = await resp.text();
            if (!texto) return {};
            try {
                return JSON.parse(texto);
            } catch {
                return { mensaje: texto };
            }
        }

        function mostrarAlertaCarrito(texto, tipo = 'info') {
            const alerta = document.getElementById('mensajeCarrito');
            alerta.className = `alert alert-${tipo} py-2 mb-3`;
            alerta.textContent = texto;
            alerta.classList.remove('d-none');
        }

        function actualizarControlesCarga(estaCargando, esNuevaBusqueda) {
            cargando = estaCargando;

            btnBuscar.disabled = estaCargando;
            btnLimpiarBusqueda.disabled = estaCargando;
            txtBusqueda.disabled = estaCargando;

            if (estaCargando) {
                spinnerBtnBuscar.classList.remove('d-none');
                textoBtnBuscar.textContent = 'Buscando...';
                estadoProceso.className = 'alert alert-warning d-flex align-items-center justify-content-between py-2';
                mensajeEstado.textContent = esNuevaBusqueda
                    ? 'Buscando productos en el servidor...'
                    : `Cargando página ${paginaActual}...`;

                if (!esNuevaBusqueda) {
                    spinnerScroll.classList.remove('d-none');
                }
            } else {
                spinnerBtnBuscar.classList.add('d-none');
                textoBtnBuscar.textContent = 'Buscar';
                spinnerScroll.classList.add('d-none');
            }
        }

        function crearCardProducto(prod) {
            const col = document.createElement('div');
            col.className = 'col';

            const id = prod.productId ?? prod.ProductId;
            const stock = Number(prod.unitsInStock ?? prod.UnitsInStock ?? 0);
            const esDescontinuado = (prod.discontinued ?? prod.Discontinued) === true;
            const noDisponible = esDescontinuado || stock <= 0;

            const card = document.createElement('div');
            card.className = 'card h-100 shadow-sm product-card border-0';

            const header = document.createElement('div');
            header.className = 'card-header bg-white d-flex justify-content-between align-items-center pt-3 border-bottom-0';

            const badgeCategoria = SeguridadUI.crearElementoTexto(
                'span',
                prod.categoryName,
                'badge bg-primary-subtle text-primary-emphasis',
                'Sin categoría'
            );

            const badgeEstado = SeguridadUI.crearElementoTexto(
                'span',
                esDescontinuado ? 'Descontinuado' : 'Disponible',
                esDescontinuado ? 'badge bg-danger' : 'badge bg-success'
            );

            header.appendChild(badgeCategoria);
            header.appendChild(badgeEstado);

            const body = document.createElement('div');
            body.className = 'card-body';

            const titulo = SeguridadUI.crearElementoTexto('h5', prod.productName, 'card-title fw-bold text-dark');

            const pProveedor = document.createElement('p');
            pProveedor.className = 'card-text text-muted small mb-2';
            const strongProv = SeguridadUI.crearElementoTexto('strong', 'Proveedor: ');
            pProveedor.appendChild(strongProv);
            pProveedor.appendChild(document.createTextNode(prod.supplierName || 'Sin proveedor'));

            const pPresentacion = document.createElement('p');
            pPresentacion.className = 'card-text text-muted small mb-0';
            const strongPres = SeguridadUI.crearElementoTexto('strong', 'Presentación: ');
            pPresentacion.appendChild(strongPres);
            pPresentacion.appendChild(document.createTextNode(prod.quantityPerUnit || 'No especificada'));

            body.appendChild(titulo);
            body.appendChild(pProveedor);
            body.appendChild(pPresentacion);

            const footer = document.createElement('div');
            footer.className = 'card-footer bg-white border-top pt-3';

            const filaPrecioStock = document.createElement('div');
            filaPrecioStock.className = 'd-flex justify-content-between align-items-center mb-2';

            const precioTexto = prod.unitPrice != null ? `$${parseFloat(prod.unitPrice).toFixed(2)}` : 'Sin precio';
            const spanPrecio = SeguridadUI.crearElementoTexto('span', precioTexto, 'fs-5 fw-bold text-success');

            const spanStock = document.createElement('span');
            spanStock.className = 'text-secondary small';
            spanStock.appendChild(document.createTextNode('Stock: '));
            const strongStock = SeguridadUI.crearElementoTexto('strong', stock);
            spanStock.appendChild(strongStock);
            spanStock.appendChild(document.createTextNode(' uds.'));

            filaPrecioStock.appendChild(spanPrecio);
            filaPrecioStock.appendChild(spanStock);
            footer.appendChild(filaPrecioStock);

            if (esUsuarioCliente()) {
                const grupoAgregar = document.createElement('div');
                grupoAgregar.className = 'input-group input-group-sm';

                const inputCantidad = document.createElement('input');
                inputCantidad.type = 'number';
                inputCantidad.className = 'form-control cantidad-card';
                inputCantidad.min = '1';
                inputCantidad.max = stock > 0 ? String(stock) : '1';
                inputCantidad.value = '1';
                inputCantidad.disabled = noDisponible;

                const btnAgregarCard = document.createElement('button');
                btnAgregarCard.type = 'button';
                btnAgregarCard.className = 'btn btn-success fw-semibold btn-agregar-card';
                btnAgregarCard.dataset.productId = String(id);
                btnAgregarCard.disabled = noDisponible;
                btnAgregarCard.textContent = esDescontinuado ? 'No disponible' : (stock <= 0 ? 'Sin stock' : 'Agregar');

                grupoAgregar.appendChild(inputCantidad);
                grupoAgregar.appendChild(btnAgregarCard);
                footer.appendChild(grupoAgregar);
            }

            card.appendChild(header);
            card.appendChild(body);
            card.appendChild(footer);
            col.appendChild(card);

            return col;
        }

        async function cargarPaginaProductos(esNuevaBusqueda = false) {
            if (cargando) return;
            if (!esNuevaBusqueda && !hayMasPaginas) return;

            if (esNuevaBusqueda) {
                paginaActual = 1;
                hayMasPaginas = true;
                totalMostrados = 0;
                SeguridadUI.limpiarContenedor(contenedorCards);
                mensajeFinCatalogo.classList.add('d-none');
            }

            actualizarControlesCarga(true, esNuevaBusqueda);

            const params = new URLSearchParams({
                busqueda: filtroActual,
                pagina: paginaActual,
                tamanio: TAMANIO_PAGINA
            });

            try {
                const respuesta = await fetch(`${API_URL_PAGINADO}?${params.toString()}`);
                const resultado = await leerRespuestaSegura(respuesta);

                if (!respuesta.ok) {
                    throw new Error(resultado.mensaje || `Error HTTP: ${respuesta.status}`);
                }

                const lista = resultado.datos || [];

                if (lista.length === 0 && paginaActual === 1) {
                    const colVacio = document.createElement('div');
                    colVacio.className = 'col-12';

                    const alerta = document.createElement('div');
                    alerta.className = 'alert alert-secondary text-center py-4';
                    alerta.appendChild(document.createTextNode('No se encontraron productos que coincidan con "'));
                    alerta.appendChild(SeguridadUI.crearElementoTexto('strong', filtroActual));
                    alerta.appendChild(document.createTextNode('".'));

                    colVacio.appendChild(alerta);
                    contenedorCards.appendChild(colVacio);
                } else {
                    lista.forEach(producto => {
                        contenedorCards.appendChild(crearCardProducto(producto));
                    });
                }

                totalMostrados += lista.length;
                hayMasPaginas = Boolean(resultado.hayMas);

                if (hayMasPaginas) {
                    paginaActual++;
                    mensajeFinCatalogo.classList.add('d-none');
                } else if (totalMostrados > 0) {
                    mensajeFinCatalogo.classList.remove('d-none');
                }

                estadoProceso.className = 'alert alert-success d-flex align-items-center justify-content-between py-2';
                mensajeEstado.textContent = 'Proceso finalizado correctamente.';
                contadorResultados.textContent = `${totalMostrados} de ${resultado.totalRegistros ?? totalMostrados} mostrados`;

            } catch (error) {
                console.error('Error al cargar productos paginados:', error);
                estadoProceso.className = 'alert alert-danger d-flex align-items-center justify-content-between py-2';
                mensajeEstado.textContent = `Error al consultar productos: ${error.message}`;
            } finally {
                actualizarControlesCarga(false, esNuevaBusqueda);
            }
        }

        async function cargarCarrito() {
            const token = obtenerTokenJwt();
            const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

            btnRefrescarCarrito.disabled = true;
            try {
                const resp = await fetch(`${API_ORDERS_BASE}/carrito`, { headers });
                const data = await leerRespuestaSegura(resp);

                if (!resp.ok) {
                    mostrarAlertaCarrito(
                        data.mensaje || data.message || (resp.status === 401 ? 'Token JWT inválido o faltante.' : `Error HTTP ${resp.status}`),
                        resp.status === 401 ? 'warning' : 'danger'
                    );
                    return;
                }

                const contenedor = document.getElementById('detalleCarrito');
                const totalTexto = document.getElementById('totalCarritoTexto');
                const items = data.items || [];

                SeguridadUI.limpiarContenedor(contenedor);

                if (items.length === 0) {
                    const pVacio = SeguridadUI.crearElementoTexto('p', 'Tu carrito está vacío.', 'text-muted mb-0');
                    contenedor.appendChild(pVacio);
                    totalTexto.textContent = '$0.00';
                    return;
                }

                const divResp = document.createElement('div');
                divResp.className = 'table-responsive';

                const tabla = document.createElement('table');
                tabla.className = 'table table-sm table-bordered align-middle mb-0';

                const thead = document.createElement('thead');
                thead.className = 'table-light';
                const trHead = document.createElement('tr');
                ['Producto', 'Precio unitario', 'Cantidad', 'Subtotal'].forEach(colTexto => {
                    trHead.appendChild(SeguridadUI.crearElementoTexto('th', colTexto));
                });
                thead.appendChild(trHead);

                const tbody = document.createElement('tbody');
                items.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.appendChild(SeguridadUI.crearElementoTexto('td', item.productName));
                    tr.appendChild(SeguridadUI.crearElementoTexto('td', `$${parseFloat(item.unitPrice).toFixed(2)}`));
                    tr.appendChild(SeguridadUI.crearElementoTexto('td', item.quantity));
                    tr.appendChild(SeguridadUI.crearElementoTexto('td', `$${parseFloat(item.subtotal).toFixed(2)}`, 'fw-semibold'));
                    tbody.appendChild(tr);
                });

                tabla.appendChild(thead);
                tabla.appendChild(tbody);
                divResp.appendChild(tabla);
                contenedor.appendChild(divResp);

                totalTexto.textContent = `$${parseFloat(data.total ?? 0).toFixed(2)}`;
            } catch (error) {
                console.error('Error al cargar carrito:', error);
                mostrarAlertaCarrito('Error de conexión al consultar el carrito.', 'danger');
            } finally {
                btnRefrescarCarrito.disabled = false;
            }
        }

        async function agregarProductoDesdeCard(boton) {
            const productId = parseInt(boton.dataset.productId, 10);
            const cardFooter = boton.closest('.card-footer');
            const inputCantidad = cardFooter ? cardFooter.querySelector('.cantidad-card') : null;
            const quantity = inputCantidad ? parseInt(inputCantidad.value, 10) : 1;

            if (!productId || isNaN(productId)) {
                mostrarAlertaCarrito('Producto inválido.', 'warning');
                return;
            }

            if (!quantity || isNaN(quantity) || quantity <= 0) {
                mostrarAlertaCarrito('Ingresa una cantidad mayor a 0.', 'warning');
                return;
            }

            const token = obtenerTokenJwt();
            const headers = {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {})
            };

            boton.disabled = true;
            const textoOriginal = boton.textContent;
            boton.textContent = 'Agregando...';

            try {
                const resp = await fetch(`${API_ORDERS_BASE}/carrito/agregar`, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({ productId, quantity })
                });

                const data = await leerRespuestaSegura(resp);
                if (!resp.ok) {
                    mostrarAlertaCarrito(
                        data.mensaje || data.message || (resp.status === 401 ? 'Inicia sesión para agregar productos.' : 'No se pudo agregar el producto.'),
                        resp.status === 401 ? 'warning' : 'danger'
                    );
                    return;
                }

                mostrarAlertaCarrito(data.mensaje || data.message || 'Producto agregado al carrito.', 'success');
                if (inputCantidad) inputCantidad.value = '1';
                await cargarCarrito();
            } catch (error) {
                console.error('Error al agregar al carrito:', error);
                mostrarAlertaCarrito('Error de conexión al agregar al carrito.', 'danger');
            } finally {
                boton.disabled = false;
                boton.textContent = textoOriginal;
            }
        }

        async function confirmarCompra() {
            const token = obtenerTokenJwt();
            const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

            btnConfirmarCompra.disabled = true;
            const textoOriginal = btnConfirmarCompra.textContent;
            btnConfirmarCompra.textContent = 'Procesando...';

            try {
                const resp = await fetch(`${API_ORDERS_BASE}/comprar`, {
                    method: 'POST',
                    headers
                });

                const data = await leerRespuestaSegura(resp);
                if (!resp.ok) {
                    mostrarAlertaCarrito(
                        data.mensaje || data.message || (resp.status === 401 ? 'Necesitas un token JWT válido para confirmar la compra.' : 'No se pudo completar la compra.'),
                        resp.status === 401 ? 'warning' : 'danger'
                    );
                    return;
                }

                mostrarAlertaCarrito(
                    `${data.mensaje || data.message || 'Compra realizada.'} Orden #${data.orderId ?? ''} - Total: $${parseFloat(data.total ?? 0).toFixed(2)}`,
                    'success'
                );
                await cargarCarrito();
                await cargarPaginaProductos(true);
            } catch (error) {
                console.error('Error al confirmar compra:', error);
                mostrarAlertaCarrito('Error de conexión al confirmar la compra.', 'danger');
            } finally {
                btnConfirmarCompra.disabled = false;
                btnConfirmarCompra.textContent = textoOriginal;
            }
        }

        contenedorCards.addEventListener('click', (e) => {
            const boton = e.target.closest('.btn-agregar-card');
            if (boton && !boton.disabled) {
                agregarProductoDesdeCard(boton);
            }
        });

        formBusqueda.addEventListener('submit', (e) => {
            e.preventDefault();
            filtroActual = txtBusqueda.value.trim();
            cargarPaginaProductos(true);
        });

        btnLimpiarBusqueda.addEventListener('click', () => {
            txtBusqueda.value = '';
            filtroActual = '';
            cargarPaginaProductos(true);
        });

        window.addEventListener('scroll', () => {
            const cercaDelFinal = (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 120);
            if (cercaDelFinal && !cargando && hayMasPaginas) {
                cargarPaginaProductos(false);
            }
        });

        btnRefrescarCarrito.addEventListener('click', cargarCarrito);
        btnConfirmarCompra.addEventListener('click', confirmarCompra);

        cargarPaginaProductos(true);
        if (esUsuarioCliente()) {
            document.getElementById('panelCarrito')?.classList.remove('d-none');
            cargarCarrito();
        }
    </script>
</body>

</html>
